name: Validate resume
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Preserve failed PDF outputs for pagination review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-pdf-outputs
          path: dist/downloads/*.pdf
          if-no-files-found: ignore
          retention-days: 7
