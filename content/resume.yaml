    service:
      ko: 오프라인 매장용 결제 단말기·POS 서비스
      en: Payment terminals and POS software for offline merchants
    logo: toss-place
    highlights:
      - id: payment-quality
        emphasis:
          ko:
            - 탐지·원인 분석·수정·재발 방지를 잇는 관리 체계를 전사 최초로 구축했습니다.
            - 연간 거래액의 {annualTransactionVolumePercent}%를 초과하는 규모의 중복 집계를 바로잡았습니다.
          en:
            - Initiated the company’s first workflow for detecting, diagnosing,
              correcting and preventing duplicate payment metrics.
            - correct duplicate records exceeding
              {annualTransactionVolumePercent}% of annual transaction volume
        label:
          ko: 결제 지표의 신뢰성을 만드는 관리 체계
          en: A repeatable process for reliable payment metrics
        text:
          ko:
            결제 지표의 중복 이슈 점검을 제안하고, 탐지·원인 분석·수정·재발 방지를 잇는 관리 체계를 전사 최초로 구축했습니다. 앱
            코드·쿼리·원데이터를 대조해 로그 중복 전송을 밝혀내고 담당자 6명과 보고 16일 만에 연간 거래액의
            {annualTransactionVolumePercent}%를 초과하는 규모의 중복 집계를 바로잡았습니다. 결제 지표 5개
            묶음과 누락·중복 등 오류 유형 5가지를 교차한 25개 점검 항목을 정립하고, 이슈별로 원인이 된 코드와 검증 쿼리를
            기록했습니다.
          en: Initiated the company’s first workflow for detecting, diagnosing, correcting
            and preventing duplicate payment metrics. Traced duplicate log
            transmissions through app code, queries and raw data; worked with 6
            colleagues to correct duplicate records exceeding
            {annualTransactionVolumePercent}% of annual transaction volume
            within 16 days of reporting. Standardized 25 checks across 5 metric
            groups and 5 error types, recording causal code and validation
            queries.
        facts:
          annualTransactionVolumePercent: 1
        evidenceId: payment-quality
        translationReviewed: true
      - id: session-integrity
        emphasis:
          ko:
            - 8종의 세션에 정상 기준을 정의
            - 매일 자동 점검하는 집계 테이블·대시보드·Slack 알림을 구축했습니다.
          en:
            - Standardized normal-state criteria
            - Automated daily log-integrity checks with aggregation tables,
              dashboards and Slack alerts.
        label:
          ko: 주문부터 VAN 통신까지, 세션 정합성 자동 점검
          en: Automated integrity checks across session types
        text:
          ko:
            POS·키오스크·프론트의 주문·결제·카드 리딩·VAN 통신·적립 등 8종의 세션에 정상 기준을 정의하고, 로그 데이터의 이상을 매일 자동
            점검하는 집계 테이블·대시보드·Slack 알림을 구축했습니다.
          en: Standardized normal-state criteria for 8 order, payment, card-reading, VAN
            communication and loyalty session types across POS, kiosks and
            customer-facing terminals. Automated daily log-integrity checks with
            aggregation tables, dashboards and Slack alerts.
        facts: {}
        evidenceId: session-integrity
        translationReviewed: true
      - id: log-workflow
        emphasis:
          ko:
            - 사내 도구 wisdom을 개발·배포했습니다.
            - 실제 등록 로그 재현율을 45%에서 71%로 높였습니다.
          en:
            - developed and released the internal tool wisdom
            - improving recall against registered logs from 45% to 71%
        label:
          ko: 로그 설계부터 QA까지 이어지는 업무 자동화
          en: Connected workflows from log design to QA
        text:
          ko:
            로그 설계·등록·QA의 업무 절차를 정리하고 이를 연결한 사내 도구 wisdom을 개발·배포했습니다. AI 로그 설계 도구를 30개
            사례에서 3회씩 평가하며 개선해 실제 등록 로그 재현율을 45%에서 71%로 높였습니다.
          en: Structured log design, registration, and QA workflows, then developed and
            released the internal tool wisdom to connect them. Evaluated an AI
            log-design tool on 30 cases with 3 runs per case, improving recall
            against registered logs from 45% to 71%.
        facts: {}
        evidenceId: log-workflow
        translationReviewed: true
      - id: merchant-classification
        text:
          ko:
            브랜드·사업자등록번호·매장 정보를 연결해 약 30만 매장의 업종을 매일 갱신하고, 다른 팀이 직접 보정할 수 있는 절차를 마련했습니다.
            업종 누락 288개를 확인하고 원인을 4가지로 분류했습니다.
          en: Linked brand, business-registration, and merchant data to update industry
            classifications for about 300,000 merchants daily. Created a
            correction workflow for other teams, identified 288 missing
            classifications, and grouped their causes into 4 types.
        facts: {}
        evidenceId: merchant-classification
        translationReviewed: true
      - id: product-log-analysis
        text:
          ko:
            키오스크의 시간 초과 안내창이 뜬 주문 중 50%가 아직 주문 중이던 고객임을 확인해 대기 시간 변경의 근거를 마련했습니다. 대기 시간을
            20초에서 40초로 바꾼 효과를 분석했습니다.
          en: Found that 50% of orders triggering a kiosk timeout prompt were still in
            progress, providing evidence to revise the timeout. Analyzed the
            effect of increasing the waiting time from 20 to 40 seconds.
        facts: {}
        evidenceId: product-log-analysis
        translationReviewed: true
  - id: doeat
    company:
      ko: 주식회사 두잇
      en: Doeat
