research:
  - id: pedagogy-r1
    venue: CIKM
    year: 2025
    role:
      ko: 공동저자
      en: Coauthor
    paper: https://doi.org/10.1145/3746252.3761133
    highlights:
      - id: pedagogy-scope
        emphasis:
          ko:
            - 5개 영역에서 비교하는 연구에 참여했습니다.
          en:
            - Contributed to research comparing educational reasoning models
        label:
          ko: 교육 과제 5개 영역 비교
          en: Five educational task domains
        text:
          ko:
            교육용 추론 모델의 성능을 교과 지식·교수법 지식·학습자의 지식 상태 추적·서술형 답안 채점·교사의 의사결정 등 5개 영역에서 비교하는
            연구에 참여했습니다.
          en: 'Contributed to research comparing educational reasoning models across 5
            domains: subject knowledge, pedagogical knowledge, knowledge
            tracing, essay scoring, and teacher decision-making.'
        facts: {}
        evidenceId: pedagogy-scope
        translationReviewed: true
      - id: pedagogy-infrastructure
        emphasis:
          ko:
            - 다중 GPU 분산 처리 기반의 평가 인프라를 구축했습니다.
          en:
            - Built a multi-GPU distributed evaluation infrastructure
        label:
          ko: 다중 GPU 평가 인프라 구축
          en: Multi-GPU evaluation infrastructure
        text:
          ko: 여러 교육 과제에서 언어모델의 성능을 평가할 수 있도록 다중 GPU 분산 처리 기반의 평가 인프라를 구축했습니다.
          en: Built a multi-GPU distributed evaluation infrastructure to assess language
            models across educational tasks.
        facts: {}
        evidenceId: pedagogy-infrastructure
        translationReviewed: true
      - id: pedagogy-reproducibility
        emphasis:
          ko:
            - 벤치마킹 파이프라인에 통합했습니다.
          en:
            - Integrated dataset versioning and automated metric logging
        label:
          ko: 평가 과정의 추적과 재현
          en: Traceable, reproducible evaluations
        text:
          ko:
            데이터셋 버전 관리와 평가 지표 자동 기록을 하나의 벤치마킹 파이프라인에 통합했습니다. 실험에 사용한 데이터와 결과를 추적하고 평가를
            재현할 수 있도록 했습니다.
          en: Integrated dataset versioning and automated metric logging into a
            benchmarking pipeline, making experimental data and results
            traceable and evaluations reproducible.
        facts: {}
        evidenceId: pedagogy-infrastructure
        translationReviewed: true
    topic:
      ko: 교육용 AI 언어모델의 성능 평가
      en: Evaluating AI reasoning models for education
    paperTitle: 'Pedagogy-R1: Pedagogical Large Reasoning Model and Well-balanced
      Educational Benchmark'
  - id: drawing-assessment
    venue: Journal of Science Education and Technology
    year: 2023
    role:
      ko: 연구 주도
      en: Research Lead
    paper: https://link.springer.com/article/10.1007/s10956-023-10042-3
    highlights:
      - id: drawing-scope
        emphasis:
          ko:
            - 과학 개념 이해도를 자동 평가하는 연구를 주도했습니다.
          en:
            - Led research
            - to assess their understanding of gas particles
        label:
          ko: 학생 1,028명의 과학 개념 평가
          en: Assessing 1,028 students’ understanding
        text:
          ko:
            학생 1,028명의 기체 입자 그림과 글 답안을 활용해 과학 개념 이해도를 자동 평가하는 연구를 주도했습니다. 기체를 입자로 표현했는지와
            입자가 공간에 어떻게 분포하는지를 평가했습니다.
          en: Led research using drawings and written responses from 1,028 students to
            assess their understanding of gas particles. Evaluated whether
            responses represented matter as particles and how those particles
            were distributed in space.
        facts: {}
        evidenceId: drawing-paper
        translationReviewed: true
      - id: drawing-method
        emphasis:
          ko:
            - 그림·글 통합 평가 모델을 개발했습니다.
          en:
            - Developed an integrated assessment model
        label:
          ko: 그림·글 통합 평가 모델 개발
          en: Combining drawing and written assessments
        text:
          ko:
            Inception-v3와 SVM으로 그림 답안을 분류하고, 글 답안에서 산출한 과학 개념 점수를 결합하는 그림·글 통합 평가 모델을
            개발했습니다.
          en: Developed an integrated assessment model combining Inception-v3 and SVM
            classification of drawings with scientific-concept scores derived
            from written responses.
        facts: {}
        evidenceId: drawing-paper
        translationReviewed: true
      - id: drawing-validation
        emphasis:
          ko:
            - 최종 분류 모델에 따라 정확도 85.9~95.6%를 확인했습니다.
          en:
            - accuracy ranged from 85.9% to 95.6%, depending on the final
              classifier
        label:
          ko: 사람의 평가와 정확도 비교
          en: Validation against human ratings
        text:
          ko: 통합 모델의 평가 결과를 사람의 평가와 비교해 검증했으며, 최종 분류 모델에 따라 정확도 85.9~95.6%를 확인했습니다.
          en: Validated the combined assessment against human ratings; accuracy ranged
            from 85.9% to 95.6%, depending on the final classifier.
        facts: {}
        evidenceId: drawing-paper
        translationReviewed: true
    topic:
      ko: 학생의 그림 답안을 AI로 자동 평가하는 연구
      en: Automated assessment of student drawings
    paperTitle: Automated Assessment of Student Hand Drawings in Free-Response Items
      on the Particulate Nature of Matter
