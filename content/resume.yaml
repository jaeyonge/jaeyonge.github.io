      en: Food ordering and delivery O2O platform
    detail:
      ko: Data Analyst · 2025.07–2025.10

        Data Analyst Intern · 2025.04–2025.07
      en: Data Analyst · Jul–Oct 2025

        Data Analyst Intern · Apr–Jul 2025
    logo: doeat
    highlights:
      - id: promotion-analysis
        emphasis:
          ko:
            - UX·안내 메시지 개선안을 제안했습니다.
            - 개선 후 3분 내 완판과 전환율 50%p 상승을 기록했습니다.
          en:
            - proposed UX and messaging changes
            - Following the changes, the promotion sold out within 3 minutes and
              conversion increased by 50 percentage points.
        label:
          ko: 구매 퍼널 분석을 프로모션 개선안으로
          en: From purchase-funnel analysis to action
        text:
          ko:
            "'디저트 100원 딜'의 구매 전환을 높이기 위해 실시간 퍼널에서 결제 단계의 이탈 원인을 찾고 UX·안내 메시지 개선안을
            제안했습니다. 개선 후 3분 내 완판과 전환율 50%p 상승을 기록했습니다."
          en: Analyzed the live purchase funnel for the “100-won Dessert Deal,” identified
            checkout drop-off causes, and proposed UX and messaging changes to
            improve conversion. Following the changes, the promotion sold out
            within 3 minutes and conversion increased by 50 percentage points.
        facts: {}
        evidenceId: promotion-analysis
        translationReviewed: true
      - id: metric-standards
        emphasis:
          ko:
            - 배송 KPI 50개 이상의 정의를 통일했습니다.
            - 재무 보고서와 대조해 보고서 간 차이를 0.01원 미만으로 줄였습니다.
          en:
            - Standardized definitions for more than 50 delivery KPIs
            - reconciled the results against finance reports to bring
              differences below KRW 0.01
        label:
          ko: 배송 KPI와 비용 집계 기준의 표준화
          en: Consistent delivery metrics and cost definitions
        text:
          ko:
            운행 시간·유휴 시간·시급 등 배송 KPI 50개 이상의 정의를 통일했습니다. 주문당 배송비의 데이터 소스와 비용 배분·윈도우 함수
            로직을 정리하고 재무 보고서와 대조해 보고서 간 차이를 0.01원 미만으로 줄였습니다.
          en: Standardized definitions for more than 50 delivery KPIs, including driving
            time, idle time, and hourly pay. Aligned data sources, cost
            allocation, and window-function logic for unit delivery cost;
            reconciled the results against finance reports to bring differences
            below KRW 0.01.
        facts: {}
        evidenceId: metric-standards
        translationReviewed: true
      - id: data-marts
        emphasis:
          ko:
            - 메뉴 큐레이션·배송·재무 데이터 마트를 개발·운영
            - 수작업 데이터 갱신 업무를 70% 줄였습니다.
          en:
            - Developed and operated data marts for menu curation, delivery, and
              finance
            - reducing manual data-refresh work by 70%
        label:
          ko: 운영 규칙을 반영한 데이터 마트와 파이프라인
          en: Data marts and pipelines built around operations
        text:
          ko:
            메뉴 큐레이션·배송·재무 데이터 마트를 개발·운영하고 레거시 배송 ETL을 최신 운영 규칙에 맞게 재설계했습니다. Airflow 기반
            파이프라인 10개 이상에 재시도·알림·모니터링을 적용해 수작업 데이터 갱신 업무를 70% 줄였습니다.
          en: Developed and operated data marts for menu curation, delivery, and finance,
            and redesigned legacy delivery ETL around current operating rules.
            Added retries, alerts, and monitoring to more than 10 Airflow
            pipelines, reducing manual data-refresh work by 70%.
        facts: {}
        evidenceId: data-marts
        translationReviewed: true
      - id: pricing-policy
        text:
          ko:
            가격 변경과 배송 지연 보상 정책의 재무 영향을 분석했습니다. 느린 배송에 따른 리텐션 감소와 고객 재획득 비용을 산정해 가격·보상
            의사결정을 지원했습니다.
          en: Analyzed the financial impact of pricing changes and compensation for
            delayed deliveries. Estimated retention losses and customer
            reacquisition costs associated with slower delivery to support
            pricing and compensation decisions.
        facts: {}
        evidenceId: pricing-policy
        translationReviewed: true
