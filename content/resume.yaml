hero:
  eyebrow:
    ko: 데이터로 이해하고, 시스템으로 해결합니다.
    en: UNDERSTAND WITH DATA. SOLVE WITH SYSTEMS.
  headline:
    ko: |-
      복잡한 문제를 풀고,
      해결을 시스템으로 만듭니다.
    en: |-
      Solve complex problems.
      Make solutions repeatable.
  summary:
    ko:
      결제·배달 O2O에서 비즈니스 문제를 분석하고 실행안을 제안합니다. 코드·쿼리·원데이터로 원인을 확인하고, 검증한 해결 방법을 팀이
      반복해서 쓰는 기준과 자동화 도구로 만듭니다.
    en: I analyze business problems in payments and food delivery and recommend
      actions. I verify causes against code, queries and raw data, then turn
      proven solutions into standards and automation that teams can reuse.
  featured:
    - highlight: payment-quality
      takeaway:
        ko: 연간 거래액의 {annualTransactionVolumePercent}%를 초과하는 중복 집계 수정
        en: Corrected duplicate records exceeding {annualTransactionVolumePercent}% of
          annual transaction volume
      translationReviewed: true
    - highlight: promotion-analysis
      takeaway:
        ko: 구매 퍼널 분석으로 결제 단계의 이탈 원인 확인
        en: Identified checkout drop-off through purchase-funnel analysis
      translationReviewed: true
